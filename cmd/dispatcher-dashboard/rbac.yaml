apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatcher-dashboard
  namespace: ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dispatcher-dashboard-logs
  namespace: ci
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dispatcher-dashboard-logs
  namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dispatcher-dashboard-logs
subjects:
- kind: ServiceAccount
  name: dispatcher-dashboard
  namespace: ci
